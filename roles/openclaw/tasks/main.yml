---
- name: Include system tools installation tasks
  ansible.builtin.include_tasks: system-tools.yml

- name: Validate VPN provider selection
  ansible.builtin.assert:
    that:
      - vpn_provider in ['', 'tailscale', 'netbird']
      - >-
        not (vpn_provider == 'netbird'
        and (tailscale_enabled | bool
        or tailscale_authkey | length > 0
        or tailscale_operator_enabled | bool))
      - vpn_provider == 'netbird' or netbird_setup_key | length == 0
    fail_msg: >-
      vpn_provider must be '', 'tailscale', or 'netbird', and credentials must
      match the selected provider. Do not combine NetBird with Tailscale
      settings or provide a NetBird key without vpn_provider=netbird.

- name: Resolve effective VPN provider
  ansible.builtin.set_fact:
    openclaw_vpn_provider: >-
      {{ vpn_provider if vpn_provider | length > 0
         else ('tailscale'
               if tailscale_enabled | bool
               or tailscale_authkey | length > 0
               or tailscale_operator_enabled | bool
               else '') }}

- name: Include Tailscale installation tasks
  ansible.builtin.include_tasks: tailscale-linux.yml
  when: openclaw_vpn_provider == 'tailscale'

- name: Include NetBird installation tasks
  ansible.builtin.include_tasks: netbird-linux.yml
  when: openclaw_vpn_provider == 'netbird'

- name: Include user creation tasks
  ansible.builtin.include_tasks: user.yml

- name: Read the current Tailscale operator
  ansible.builtin.command: tailscale get operator
  register: tailscale_operator_current
  changed_when: false
  failed_when: false
  when: tailscale_operator_enabled | bool

- name: Fail safely when the current Tailscale operator cannot be read
  ansible.builtin.fail:
    msg: >-
      Unable to read the current Tailscale operator. No permission was changed.
      Verify `sudo tailscale get operator` before retrying.
  when:
    - tailscale_operator_enabled | bool
    - (tailscale_operator_current.rc | default(1)) != 0

- name: Refuse to replace an existing Tailscale operator
  ansible.builtin.fail:
    msg: >-
      Tailscale already delegates operator access to
      '{{ tailscale_operator_current.stdout | trim }}'. No permission was
      changed. Remove that delegation explicitly before granting it to
      '{{ openclaw_user }}'.
  when:
    - tailscale_operator_enabled | bool
    - (tailscale_operator_current.rc | default(1)) == 0
    - tailscale_operator_current.stdout | default('') | trim | length > 0
    - tailscale_operator_current.stdout | default('') | trim != openclaw_user

- name: Grant the openclaw user Tailscale operator access
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--operator={{ openclaw_user }}"
  changed_when: true
  when:
    - tailscale_operator_enabled | bool
    - (tailscale_operator_current.rc | default(1)) == 0
    - tailscale_operator_current.stdout | default('') | trim | length == 0

- name: Include Docker installation tasks
  ansible.builtin.include_tasks: docker-linux.yml
  when: not ci_test

- name: Include firewall configuration tasks
  ansible.builtin.include_tasks: firewall-linux.yml
  when: not ci_test

- name: Include Node.js installation tasks
  ansible.builtin.include_tasks: nodejs.yml

- name: Include OpenClaw setup tasks
  ansible.builtin.include_tasks: openclaw.yml
