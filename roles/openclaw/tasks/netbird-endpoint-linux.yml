---
# Moving an enrolled peer between management services changes its trust domain.
# Detect drift, but require an operator to perform that migration deliberately.

- name: Read the effective NetBird client configuration
  ansible.builtin.command:
    argv:
      - timeout
      - '15'
      - netbird
      - debug
      - config
  register: netbird_effective_config
  changed_when: false
  failed_when: false

- name: Fail safely when the NetBird management endpoint cannot be verified
  ansible.builtin.fail:
    msg: >-
      NetBird is connected, but its effective management endpoint could not be
      verified. No control-plane migration was attempted. Update the NetBird
      client so `sudo netbird debug config` is available, verify its
      managementUrl, and rerun the playbook.
  when: netbird_effective_config.rc != 0

- name: Parse requested and effective NetBird management endpoints
  ansible.builtin.set_fact:
    netbird_requested_management_parts: >-
      {{ netbird_management_url | ansible.builtin.urlsplit }}
    netbird_effective_management_url: >-
      {{ (netbird_effective_config.stdout | from_json).managementUrl
         | default('') }}
    netbird_effective_management_parts: >-
      {{ ((netbird_effective_config.stdout | from_json).managementUrl
          | default('')) | ansible.builtin.urlsplit }}

- name: Compare requested and effective NetBird management endpoints
  ansible.builtin.set_fact:
    netbird_management_endpoint_matches: >-
      {{
        (netbird_requested_management_parts.scheme | lower)
          == (netbird_effective_management_parts.scheme | lower)
        and (netbird_requested_management_parts.hostname | lower)
          == (netbird_effective_management_parts.hostname | lower)
        and (netbird_requested_management_parts.port
             | default(443
                       if netbird_requested_management_parts.scheme == 'https'
                       else 80, true) | int)
          == (netbird_effective_management_parts.port
              | default(443
                        if netbird_effective_management_parts.scheme == 'https'
                        else 80, true) | int)
        and (netbird_requested_management_parts.path
             | default('') | regex_replace('/+$', ''))
          == (netbird_effective_management_parts.path
              | default('') | regex_replace('/+$', ''))
      }}

- name: Refuse automatic NetBird management service migration
  ansible.builtin.fail:
    msg: >-
      NetBird is connected to '{{ netbird_effective_management_url }}', but
      netbird_management_url requests '{{ netbird_management_url }}'. Refusing
      to move an enrolled peer between management services automatically. Run
      `sudo netbird down`, deliberately re-enroll it with
      `{{ openclaw_vpn_connect_command }}` and the required credentials, then
      rerun the playbook.
  when: not (netbird_management_endpoint_matches | bool)
